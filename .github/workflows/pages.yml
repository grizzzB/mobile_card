# 정적 페이지를 GitHub Pages 로 배포합니다.
# 이 저장소의 Pages 소스는 "GitHub Actions" 로 설정돼 있는데, 기존 Jekyll
# 워크플로가 삭제된 뒤로 배포가 멈춰 있었습니다. 이 워크플로가 그 자리를
# 대신합니다. Jekyll 을 거치지 않고 저장소 내용을 그대로 올립니다(.nojekyll).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
