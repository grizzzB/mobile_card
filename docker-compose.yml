# Local preview with Vite HMR — edit source/images without rebuilding.
# Usage: docker compose up
# Open http://localhost:5173
services:
  web:
    image: node:24-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - mobile_card_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  mobile_card_node_modules:
